<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <title>{{option_a}} vs {{option_b}}!</title>
    <base href="/index.html">
    <meta name = "viewport" content = "width=device-width, initial-scale = 1.0">
    <meta name="keywords" content="docker-compose, docker, stack">
    <meta name="author" content="Tutum dev team">
    <link rel='stylesheet' href="{{ url_for('static',filename='stylesheets/style.css') }}" />
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.4.0/css/font-awesome.min.css">
  </head>
  <body>
    <main id="content-container">
      <div id="content-container-center">
        <h1>{{option_a}} vs {{option_b}}!</h1>
        <form id="choice" name='form' method="POST" action="/">
          <button id="a" type="submit" name="vote" class="a" value="a" aria-label="投给{{option_a}}">{{option_a}}</button>
          <button id="b" type="submit" name="vote" class="b" value="b" aria-label="投给{{option_b}}">{{option_b}}</button>
        </form>
        {% if vote == "a" %}
        <div id="vote-confirmation" data-vote="a">你已投给{{option_a}}</div>
        {% elif vote == "b" %}
        <div id="vote-confirmation" data-vote="b">你已投给{{option_b}}</div>
        {% endif %}
        <div id="tip">
          使用 Tab 键选择投票选项，按 Enter 或空格键提交。
        </div>
        <div id="hostname">
          Processed by container ID {{hostname}}
        </div>
      </div>
    </main>
    <script src="http://code.jquery.com/jquery-latest.min.js" type="text/javascript"></script>
    <script src="//cdnjs.cloudflare.com/ajax/libs/jquery-cookie/1.4.1/jquery.cookie.js"></script>

    {% if vote %}
    <script>
      var vote = {{vote|tojson}};
      var selected = document.getElementById(vote);
      var other = document.getElementById(vote == "a" ? "b" : "a");
      selected.disabled = true;
      var check = document.createElement("i");
      check.className = "fa fa-check-circle";
      check.setAttribute("aria-hidden", "true");
      selected.append(" ", check);
      other.style.opacity = "0.5";
    </script>
    {% endif %}
  </body>
</html>
